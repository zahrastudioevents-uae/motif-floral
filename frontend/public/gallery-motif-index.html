  .cell{position:relative}
  .cell img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
  .num{position:absolute;top:6px;left:6px;color:#fff;font-weight:700;font-size:15px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;background:#26231f}
  .cell.new .num{background:#9c6b4f}
